name: Release Python Package

on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
      python_version:
        type: string
        default: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.meta.outputs.name }}
      package_version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install ${{ inputs.python_version }}

      - name: Extract package metadata
        id: meta
        run: |
          name=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['name'])" 2>/dev/null || \
                 grep '^name' pyproject.toml | head-1 | sed 's/.*= *"\(.*\)"/\1/')
          version=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])" 2>/dev/null || \
                    grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          uv sync --all-extras --dev
          uv run pytest -q --tb=short

      - name: Build distribution
        run: uv build

      - name: Check distribution
        run: uv run twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publisher

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publisher)
        if: "!inputs.dry_run"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

      - name: Dry run check
        if: inputs.dry_run
        run: |
          echo "Dry run: would publish ${{ needs.build.outputs.package_name }}==${{ needs.build.outputs.package_version }} to PyPI"
          ls dist/

      - name: Emit fleet event
        if: "!inputs.dry_run"
        env:
          SUPERINSTANCE_REGISTRY_URL: ${{ secrets.SUPERINSTANCE_REGISTRY_URL }}
        run: |
          if [ -z "$SUPERINSTANCE_REGISTRY_URL" ]; then exit 0; fi
          python3 - <<'PYEOF'
          import os, json, urllib.request

          registry_url = os.environ["SUPERINSTANCE_REGISTRY_URL"]
          body = json.dumps({
              "event_type": "package_published",
              "agent_id":   f"release:{os.environ.get('GITHUB_REPOSITORY','')}",
              "vessel_id":  "github-actions",
              "payload": {
                  "package":  "${{ needs.build.outputs.package_name }}",
                  "version":  "${{ needs.build.outputs.package_version }}",
                  "registry": "pypi",
                  "repo":     os.environ.get("GITHUB_REPOSITORY", ""),
              },
              "severity": "info",
          }).encode()

          url = registry_url.rstrip("/") + "/rest/v1/fleet_events"
          req = urllib.request.Request(url, data=body, method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Prefer": "return=minimal",
                  "apikey": os.environ.get("SUPERINSTANCE_ANON_KEY", ""),
                  "Authorization": f"Bearer {os.environ.get('SUPERINSTANCE_SERVICE_KEY', os.environ.get('SUPERINSTANCE_ANON_KEY', ''))}",
              })
          try:
              urllib.request.urlopen(req, timeout=10)
              print("fleet event emitted")
          except Exception as e:
              print(f"non-fatal: {e}")
          PYEOF
